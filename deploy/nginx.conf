# Nginx — SPA fallback + cache de assets
# Coloque o conteúdo de `dist/` em /var/www/rubintrade
server {
  listen 80;
  server_name _;
  root /var/www/rubintrade;
  index index.html;

  # Assets com hash → cache longo
  location ~* \.(js|css|woff2?|ttf|otf|svg|png|jpg|jpeg|gif|webp|avif)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml+rss text/javascript image/svg+xml;
}
